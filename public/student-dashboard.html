<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - UniEvent</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* CSS for Modal Structure (Inlined for functionality) */
        .app-modal {
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center; 
            align-items: center;
        }

        .modal-content-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            max-width: 350px;
            width: 90%;
            position: relative;
            transform: scale(1.05); 
            animation: fadeIn 0.3s ease-out;
            margin-top: 0; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }
        
        .modal-content-box h3 {
            margin-top: 0;
            font-size: 1.5em;
        }

        .modal-content-box p {
            font-size: 1em;
            color: #555;
            margin-bottom: 20px;
        }

        .modal-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .modal-button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s;
        }
        
        /* Theming for different types */
        .success-modal .modal-icon { color: #4CAF50; }
        .error-modal .modal-icon { color: #f44336; }
        .info-modal .modal-icon { color: #2196F3; }

        .success-modal .modal-button { background-color: #4CAF50; color: white; }
        .error-modal .modal-button { background-color: #f44336; color: white; }
        .info-modal .modal-button { background-color: #2196F3; color: white; }

        .success-modal .modal-button:hover { background-color: #388E3C; }
        .error-modal .modal-button:hover { background-color: #D32F2F; }
        .info-modal .modal-button:hover { background-color: #1976D2; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Dashboard Header -->
        <header class="dashboard-header">
            <div class="logo">
                <i class="fas fa-calendar-check logo-icon"></i>
                <span>UniEvent Dashboard</span>
            </div>
            <div class="user-info">
                <span id="welcome-message">Hello, Student!</span>
                <button id="logout-btn" class="btn btn-secondary"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="dashboard-main">
            <!-- Sidebar for Navigation/Filters -->
            <aside class="dashboard-sidebar">
                <h2>Browse Events</h2>
                
                <nav class="simple-nav">
                    <a href="student-dashboard.html" class="nav-item active">Upcoming Events</a>
                    <a href="my-registrations.html" class="nav-item">My Registrations</a>
                    <a href="student-profile.html" class="nav-item"><i class="fas fa-user-circle"></i> My Profile</a>
                </nav>

                <hr style="margin: 20px 0;">

                <h3>Filter Events</h3>
                <!-- The filters are now aligned horizontally on larger screens -->
                <div class="filter-container-row">
                    <div class="filter-group">
                        <label>Department:</label>
                        <select id="dept-filter">
                            <option value="all">All Departments</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Type:</label>
                        <select id="type-filter">
                            <option value="all">All Types</option>
                            <option value="Technical">Technical</option>
                            <option value="Non-Technical">Non-Technical</option>
                            <option value="General">General / Mixed</option>
                        </select>
                    </div>
                </div>
            </aside>
            
            <!-- Event Listing -->
            <section class="event-list-section">
                <h2>Upcoming Events</h2>
                <div id="event-list" class="event-grid">
                    <!-- Event cards will be inserted here by JavaScript -->
                    <p class="loading-message">Loading events...</p>
                </div>
            </section>
        </main>
        
        <!-- UNIVERSAL CUSTOM MESSAGE MODAL STRUCTURE -->
        <div id="app-modal" class="app-modal">
            <div class="modal-content-box">
                <i id="modal-icon" class="modal-icon"></i>
                <h3 id="modal-title">Status</h3>
                <p id="modal-message">Loading...</p>
                <button class="modal-button" onclick="hideAlert()">OK</button>
            </div>
        </div>
    </div>

    <!-- CRITICAL: Link UI utility first, then the main script -->
    <script src="/js/ui-utils.js"></script>
    <script src="/js/student-dashboard.js"></script>
</body>
</html>
